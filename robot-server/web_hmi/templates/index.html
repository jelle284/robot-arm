<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Arm HMI</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; background: #fafbfc; }
        .motor-row { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px dashed #ccc; padding-bottom: 8px; }
        .control-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .control-row label { width: 60px; font-weight: bold; }
        .control-row input[type="number"] { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        .sync-btn { background: #e1e4e8; border: 1px solid #cbd5e0; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .sync-btn:hover { background: #d1d5db; }
        .btn { display: block; width: 100%; background: #0366d6; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #0256b4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Robot Arm Web HMI</h1>
        <div class="grid">
            <div class="card">
                <h2>Live Robot State (Steps)</h2>
                <div id="telemetry"><p>Connecting...</p></div>
            </div>
            <div class="card">
                <h2>Target Commands (Steps)</h2>
                <form onsubmit="event.preventDefault(); sendPositions();">
                    <div id="controls"></div>
                    <button type="submit" class="btn">Send Commands</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        const ctrl = document.getElementById('controls');
        let hasInitialized = false;
        let currentLivePositions = Array(6).fill(0);

        // Generer tekstbokse og tilhørende Sync-knapper
        for (let i = 0; i < 6; i++) {
            ctrl.innerHTML += `
                <div class="control-row">
                    <label>Joint ${i+1}:</label>
                    <input type="number" id="n-${i}" placeholder="Steps" value="0">
                    <button type="button" class="sync-btn" onclick="syncJoint(${i})" title="Copy live position to input">🔄 Sync</button>
                </div>`;
        }

        // Kopierer den specifikke live-position ind i tekstboksen
        function syncJoint(index) {
            document.getElementById(`n-${index}`).value = currentLivePositions[index];
        }

        async function fetchState() {
            try {
                const r = await fetch('/api/state');
                const d = await r.json();
                
                // Gem de rå tal globalt, så sync-knapperne kan bruge dem
                currentLivePositions = d.position;

                let html = '';
                for(let i=0; i<6; i++) {
                    html += `<div class="motor-row"><strong>Joint ${i+1}</strong> <span>Pos: ${d.position[i]} | Vel: ${d.velocity[i]}</span></div>`;
                    
                    // Første gang vi får fat i robotten, udfylder vi felterne med de rigtige tal i stedet for 0
                    if (!hasInitialized && d.position.some(p => p !== 0)) {
                        document.getElementById(`n-${i}`).value = d.position[i];
                    }
                }
                
                if (d.position.some(p => p !== 0)) {
                    hasInitialized = true;
                }

                document.getElementById('telemetry').innerHTML = html;
            } catch (e) {
                document.getElementById('telemetry').innerHTML = '<p style="color:red;">Disconnected from backend</p>';
            }
        }

        async function sendPositions() {
            const positions = Array.from({length: 6}, (_, i) => parseInt(document.getElementById(`n-${i}`).value) || 0);
            await fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ positions })
            });
        }

        // Hent live-data hvert 200. millisekund
        setInterval(fetchState, 200);
    </script>
</body>
</html>
